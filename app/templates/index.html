<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReoFTPView - CCTV Footage Browser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans select-none">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-10">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fa-solid fa-video text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
          ReoFTPView
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">FTP Archive</span>
        </h1>
        <p class="text-xs text-slate-400">Direct HTML5 Range-Seek • Auto-Retention {{ retention_days }} Days</p>
      </div>
    </div>

    <!-- Storage Info & Cleanup Action -->
    <div class="flex items-center space-x-4">
      <div id="storage-pill" class="hidden sm:flex items-center space-x-2 bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1 text-xs">
        <i class="fa-solid fa-hard-drive text-slate-400"></i>
        <span id="storage-text" class="text-slate-300">Loading disk...</span>
        <div class="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden ml-1">
          <div id="storage-bar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <button id="btn-cleanup" onclick="triggerCleanup()" class="text-xs bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition text-slate-300">
        <i id="cleanup-icon" class="fa-solid fa-broom"></i>
        <span>Clean Retention</span>
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- LEFT SIDEBAR: CAMERAS -->
    <aside class="w-64 bg-slate-900/60 border-r border-slate-800 flex flex-col flex-shrink-0">
      <div class="p-3 border-b border-slate-800/80 flex items-center justify-between text-xs text-slate-400 font-semibold uppercase tracking-wider">
        <span>Cameras</span>
        <button onclick="loadCameras()" class="hover:text-emerald-400 transition" title="Refresh cameras">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
      <div id="camera-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Dynamically filled -->
        <div class="p-4 text-center text-xs text-slate-500">Scanning cameras...</div>
      </div>
    </aside>

    <!-- RIGHT CONTENT: DATE TOOLBAR + VIDEO GRID -->
    <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
      
      <!-- SUB-TOOLBAR: DATES -->
      <div class="bg-slate-900/40 border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center space-x-2">
          <button onclick="selectQuickDate('today')" class="px-2.5 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">Today</button>
          <button onclick="selectQuickDate('yesterday')" class="px-2.5 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">Yesterday</button>
          
          <div class="h-4 w-px bg-slate-800 mx-1"></div>

          <label class="text-xs text-slate-400 flex items-center gap-1">
            <i class="fa-regular fa-calendar"></i>
            <select id="date-select" onchange="onDateChanged(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded px-2 py-1 outline-none focus:border-emerald-500">
              <option value="">Select Date...</option>
            </select>
          </label>
        </div>

        <div class="flex items-center space-x-3 text-xs text-slate-400">
          <span id="active-cam-label" class="font-medium text-white">-</span>
          <span id="clip-count-label" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-mono">0 clips</span>
        </div>
      </div>

      <!-- RECORDINGS GRID -->
      <div id="recordings-container" class="flex-1 overflow-y-auto p-4">
        <!-- Grid filled by JS -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
          <i class="fa-solid fa-film text-4xl text-slate-700"></i>
          <p class="text-sm">Select a camera and date to view recordings</p>
        </div>
        <div id="grid-view" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 hidden"></div>
      </div>
    </main>
  </div>

  <!-- VIDEO MODAL PLAYER -->
  <div id="video-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl max-w-5xl w-full flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="px-4 py-3 bg-slate-800/80 border-b border-slate-700/60 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-play text-emerald-400 text-sm"></i>
          <span id="modal-title" class="font-semibold text-sm text-white truncate max-w-md">Video Player</span>
          <span id="modal-meta" class="text-xs text-slate-400 font-mono ml-2"></span>
        </div>
        <div class="flex items-center space-x-2">
          <a id="modal-download" href="#" download class="text-slate-400 hover:text-white px-2 py-1 rounded hover:bg-slate-700 text-xs" title="Download clip">
            <i class="fa-solid fa-download"></i>
          </a>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white px-2 py-1 rounded hover:bg-slate-700 text-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Native HTML5 Video (Direct Range-Seek) -->
      <div class="relative bg-black flex items-center justify-center aspect-video">
        <video id="player" controls autoplay playsinline crossorigin="anonymous" preload="metadata" class="w-full h-full object-contain"></video>
      </div>

      <!-- Modal Footer & Controls -->
      <div class="px-4 py-2.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-300 flex-wrap gap-2">
        <div class="flex items-center space-x-2">
          <button onclick="playPrevClip()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700" title="Previous clip (Left Arrow)">
            <i class="fa-solid fa-backward-step mr-1"></i> Prev
          </button>
          <button onclick="playNextClip()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 border border-slate-700" title="Next clip (Right Arrow)">
            Next <i class="fa-solid fa-forward-step ml-1"></i>
          </button>
        </div>

        <div class="flex items-center space-x-4">
          <!-- Audio Boost Controls -->
          <div class="flex items-center space-x-1.5">
            <i class="fa-solid fa-volume-high text-slate-400"></i>
            <span class="text-slate-500">Boost:</span>
            <div class="flex space-x-1">
              <button onclick="setBoost(1.0)" data-boost="1.0" class="boost-btn px-2 py-0.5 rounded bg-emerald-600 font-bold border border-emerald-500 text-white" title="Standard volume (100%)">1x</button>
              <button onclick="setBoost(2.5)" data-boost="2.5" class="boost-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300" title="2.5x volume boost (+8 dB)">2.5x</button>
              <button onclick="setBoost(5.0)" data-boost="5.0" class="boost-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300" title="5x volume boost (+14 dB)">5x</button>
              <button onclick="setBoost(10.0)" data-boost="10.0" class="boost-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300" title="10x volume boost (+20 dB)">10x</button>
            </div>
          </div>

          <div class="h-4 w-px bg-slate-800"></div>

          <!-- Speed Controls -->
          <div class="flex items-center space-x-1.5">
            <span class="text-slate-500">Speed:</span>
            <div class="flex space-x-1">
              <button onclick="setSpeed(0.5)" class="speed-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700">0.5x</button>
              <button onclick="setSpeed(1.0)" class="speed-btn px-2 py-0.5 rounded bg-emerald-600 font-bold border border-emerald-500">1x</button>
              <button onclick="setSpeed(2.0)" class="speed-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700">2x</button>
              <button onclick="setSpeed(4.0)" class="speed-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700">4x</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    let currentCamera = null;
    let currentDate = null;
    let currentRecordings = [];
    let currentClipIndex = -1;

    document.addEventListener("DOMContentLoaded", () => {
      loadStatus();
      loadCameras();

      // Keyboard shortcuts for modal player
      window.addEventListener("keydown", (e) => {
        const modal = document.getElementById("video-modal");
        if (!modal.classList.contains("hidden")) {
          if (e.key === "Escape") closeModal();
          if (e.key === "ArrowLeft") playPrevClip();
          if (e.key === "ArrowRight") playNextClip();
        }
      });
    });

    // 1. Storage Status
    async function loadStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        const text = `Footage: ${data.footage.footage_formatted} (${data.footage.total_clips} clips) • Free: ${data.storage.free_gb} GB`;
        const pill = document.getElementById("storage-pill");
        document.getElementById("storage-text").innerText = text;
        document.getElementById("storage-bar").style.width = `${Math.min(100, data.storage.used_pct)}%`;
        pill.title = `Actual Footage: ${data.footage.footage_formatted} across ${data.footage.total_clips} clips\nRAID Disk Total: ${data.storage.total_gb} GB\nRAID Disk Used: ${data.storage.used_gb} GB (${data.storage.used_pct}%)\nRAID Disk Free: ${data.storage.free_gb} GB`;
        pill.classList.remove("hidden");
      } catch (err) {
        console.error("Status load failed", err);
      }
    }

    // 2. Load Cameras
    async function loadCameras() {
      const container = document.getElementById("camera-list");
      container.innerHTML = '<div class="p-4 text-center text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Scanning...</div>';

      try {
        const res = await fetch("/api/cameras");
        const cameras = await res.json();

        if (!cameras || cameras.length === 0) {
          container.innerHTML = '<div class="p-4 text-center text-xs text-slate-500">No camera directories found in recordings path.</div>';
          return;
        }

        container.innerHTML = "";
        cameras.forEach((cam, index) => {
          const btn = document.createElement("button");
          btn.className = `w-full text-left px-3 py-2.5 rounded-lg text-xs flex items-center justify-between transition ${
            index === 0 ? "bg-slate-800 text-white font-medium" : "text-slate-300 hover:bg-slate-800/50"
          }`;
          btn.id = `cam-btn-${cam.id}`;
          btn.onclick = () => selectCamera(cam);
          btn.innerHTML = `
            <div class="flex items-center space-x-2 truncate">
              <i class="fa-solid fa-video text-slate-400 text-xs"></i>
              <span class="truncate">${cam.name}</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700/60 text-slate-400 font-mono">${cam.video_count}</span>
          `;
          container.appendChild(btn);
        });

        // Automatically pick first camera
        if (cameras.length > 0) {
          selectCamera(cameras[0]);
        }
      } catch (err) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-red-400">Failed to load cameras: ${err.message}</div>`;
      }
    }

    // 3. Select Camera
    async function selectCamera(cam) {
      currentCamera = cam;
      document.querySelectorAll("[id^='cam-btn-']").forEach(el => {
        el.className = "w-full text-left px-3 py-2.5 rounded-lg text-xs flex items-center justify-between transition text-slate-300 hover:bg-slate-800/50";
      });
      const activeBtn = document.getElementById(`cam-btn-${cam.id}`);
      if (activeBtn) activeBtn.className = "w-full text-left px-3 py-2.5 rounded-lg text-xs flex items-center justify-between transition bg-slate-800 text-white font-medium border border-slate-700";

      document.getElementById("active-cam-label").innerText = cam.name;

      // Load dates for this camera
      const res = await fetch(`/api/cameras/${cam.id}/dates`);
      const dates = await res.json();

      const dateSelect = document.getElementById("date-select");
      dateSelect.innerHTML = "";

      if (!dates || dates.length === 0) {
        dateSelect.innerHTML = '<option value="">No recordings</option>';
        showEmpty("No recordings found for this camera");
        return;
      }

      dates.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.innerText = d;
        dateSelect.appendChild(opt);
      });

      // Default to most recent date
      currentDate = dates[0];
      dateSelect.value = currentDate;
      loadRecordings();
    }

    function onDateChanged(dateVal) {
      if (!dateVal) return;
      currentDate = dateVal;
      loadRecordings();
    }

    function selectQuickDate(type) {
      const d = new Date();
      if (type === "yesterday") {
        d.setDate(d.getDate() - 1);
      }
      const dateStr = d.toISOString().split("T")[0];
      const dateSelect = document.getElementById("date-select");
      dateSelect.value = dateStr;
      currentDate = dateStr;
      loadRecordings();
    }

    // 4. Load Recordings for Camera + Date
    async function loadRecordings() {
      if (!currentCamera || !currentDate) return;

      const grid = document.getElementById("grid-view");
      const empty = document.getElementById("empty-state");
      empty.classList.add("hidden");
      grid.classList.remove("hidden");
      grid.innerHTML = '<div class="col-span-full py-12 text-center text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading clips...</div>';

      try {
        const res = await fetch(`/api/cameras/${currentCamera.id}/recordings?date=${currentDate}`);
        currentRecordings = await res.json();

        document.getElementById("clip-count-label").innerText = `${currentRecordings.length} clips`;

        if (!currentRecordings || currentRecordings.length === 0) {
          showEmpty(`No recordings on ${currentDate}`);
          return;
        }

        grid.innerHTML = "";
        currentRecordings.forEach((rec, idx) => {
          const card = document.createElement("div");
          card.className = "group relative bg-slate-900 border border-slate-800/80 rounded-xl overflow-hidden hover:border-slate-700 hover:shadow-lg transition flex flex-col";
          card.innerHTML = `
            <!-- Thumbnail View -->
            <div class="relative aspect-video bg-black/60 overflow-hidden cursor-pointer" onclick="openPlayer(${idx})">
              <img src="/api/thumb/${encodeURIComponent(rec.rel_path)}" 
                   loading="lazy" 
                   onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" 
                   class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
              <div class="hidden absolute inset-0 flex items-center justify-center text-slate-600 bg-slate-950">
                <i class="fa-solid fa-file-video text-2xl"></i>
              </div>
              <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition flex items-center justify-center">
                <div class="w-10 h-10 rounded-full bg-slate-900/80 border border-slate-600/50 flex items-center justify-center text-white group-hover:scale-110 group-hover:bg-emerald-600 group-hover:border-emerald-500 transition shadow">
                  <i class="fa-solid fa-play ml-0.5 text-xs"></i>
                </div>
              </div>
              <span class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-sm text-[11px] font-mono font-medium px-2 py-0.5 rounded text-white border border-white/10">
                ${rec.time}
              </span>
            </div>

            <!-- Card Details -->
            <div class="p-2.5 flex items-center justify-between text-xs border-t border-slate-800/60 bg-slate-900/50">
              <span class="text-slate-400 font-mono text-[11px]">${rec.size_formatted}</span>
              <div class="flex items-center space-x-1">
                <a href="/api/stream/${encodeURIComponent(rec.rel_path)}" download="${rec.filename}" class="p-1 text-slate-400 hover:text-white rounded hover:bg-slate-800 transition" title="Download">
                  <i class="fa-solid fa-download text-xs"></i>
                </a>
                <button onclick="deleteRecording('${encodeURIComponent(rec.rel_path)}', ${idx})" class="p-1 text-slate-400 hover:text-red-400 rounded hover:bg-slate-800 transition" title="Delete">
                  <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        showEmpty(`Error: ${err.message}`);
      }
    }

    function showEmpty(msg) {
      document.getElementById("grid-view").classList.add("hidden");
      const empty = document.getElementById("empty-state");
      empty.classList.remove("hidden");
      empty.querySelector("p").innerText = msg;
      document.getElementById("clip-count-label").innerText = `0 clips`;
    }

    // 5. Video Player Modal & Web Audio Boost
    let audioCtx = null;
    let gainNode = null;
    let currentBoost = 2.5; // Default to 2.5x boost for surveillance cameras

    function ensureAudioBoost() {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
            const player = document.getElementById("player");
            const source = audioCtx.createMediaElementSource(player);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = currentBoost;
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (err) {
        console.warn("Audio boost init:", err);
      }
    }

    function setBoost(multiplier) {
      currentBoost = multiplier;
      ensureAudioBoost();
      if (gainNode) {
        gainNode.gain.value = multiplier;
      }
      updateBoostButtons(multiplier);
    }

    function updateBoostButtons(multiplier) {
      document.querySelectorAll(".boost-btn").forEach(btn => {
        if (parseFloat(btn.dataset.boost) === multiplier) {
          btn.className = "boost-btn px-2 py-0.5 rounded bg-emerald-600 font-bold border border-emerald-500 text-white";
        } else {
          btn.className = "boost-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300";
        }
      });
    }

    function openPlayer(index) {
      if (index < 0 || index >= currentRecordings.length) return;
      currentClipIndex = index;
      const rec = currentRecordings[index];

      const modal = document.getElementById("video-modal");
      const player = document.getElementById("player");

      document.getElementById("modal-title").innerText = `${currentCamera.name} • ${rec.filename}`;
      document.getElementById("modal-meta").innerText = `${rec.datetime} • ${rec.size_formatted}`;

      const streamUrl = `/api/stream/${encodeURIComponent(rec.rel_path)}`;
      document.getElementById("modal-download").href = streamUrl;
      document.getElementById("modal-download").download = rec.filename;

      player.src = streamUrl;
      player.playbackRate = 1.0;
      player.muted = false;
      player.volume = 1.0;
      updateSpeedButtons(1.0);
      updateBoostButtons(currentBoost);
      modal.classList.remove("hidden");

      ensureAudioBoost();

      player.play().catch(e => {
        console.log("Unmuted autoplay restricted, user click needed to unmute:", e);
      });
    }

    function closeModal() {
      const modal = document.getElementById("video-modal");
      const player = document.getElementById("player");
      player.pause();
      player.removeAttribute("src");
      player.load();
      modal.classList.add("hidden");
    }

    function playPrevClip() {
      if (currentClipIndex > 0) openPlayer(currentClipIndex - 1);
    }

    function playNextClip() {
      if (currentClipIndex < currentRecordings.length - 1) openPlayer(currentClipIndex + 1);
    }

    function setSpeed(rate) {
      const player = document.getElementById("player");
      player.playbackRate = rate;
      updateSpeedButtons(rate);
    }

    function updateSpeedButtons(rate) {
      document.querySelectorAll(".speed-btn").forEach(btn => {
        if (parseFloat(btn.innerText) === rate) {
          btn.className = "speed-btn px-2 py-0.5 rounded bg-emerald-600 font-bold border border-emerald-500 text-white";
        } else {
          btn.className = "speed-btn px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-300";
        }
      });
    }

    // 6. Delete Clip
    async function deleteRecording(relPath, index) {
      if (!confirm("Are you sure you want to delete this recording?")) return;
      try {
        const res = await fetch(`/api/recording/${relPath}`, { method: "DELETE" });
        if (res.ok) {
          currentRecordings.splice(index, 1);
          loadRecordings();
          loadStatus();
        } else {
          alert("Failed to delete recording.");
        }
      } catch (err) {
        alert(`Error: ${err.message}`);
      }
    }

    // 7. Trigger Retention Cleanup
    async function triggerCleanup() {
      const icon = document.getElementById("cleanup-icon");
      icon.className = "fa-solid fa-spinner fa-spin";
      try {
        const res = await fetch("/api/cleanup", { method: "POST" });
        const data = await res.json();
        alert(`Cleanup finished:\n• Deleted ${data.deleted_files} files\n• Freed ${data.freed_mb} MB\n• Cleaned ${data.cleaned_dirs} empty folders`);
        loadStatus();
        loadRecordings();
      } catch (err) {
        alert("Cleanup failed: " + err.message);
      } finally {
        icon.className = "fa-solid fa-broom";
      }
    }
  </script>
</body>
</html>
